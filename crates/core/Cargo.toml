[package]
name = "traffic-light-core"
version = "0.1.0"
edition = "2021"
description = "Session state machine and local hook server for the Claude Code traffic light"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
