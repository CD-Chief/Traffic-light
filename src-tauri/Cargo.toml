[package]
name = "traffic-light"
version = "0.1.0"
edition = "2021"
description = "Always-on-top widget showing one light per running Claude Code session"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
traffic-light-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
